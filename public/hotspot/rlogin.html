<form name="redirect" action="$(link-login-only)" method="post">
  <input type="hidden" name="username" value="$(mac)">
  <input type="hidden" name="password" value="$(mac)">
  <input type="hidden" name="dst" value="$(link-orig)">
  <input type="hidden" name="popup" value="true">
</form>
<script>
(function(){
  var f = document.redirect;
  $(if chap-id)
  if(typeof hexMD5 === 'function'){
    f.password.value = hexMD5('$(chap-id)' + f.password.value + '$(chap-challenge)');
  } else {
    // md5.js tidak termuat: jangan kirim password polos, arahkan ke halaman login manual
    window.location.href = 'login.html';
    return;
  }
  $(endif)
  f.submit();
})();
</script>
