<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menghubungkan &mdash; Gracie Kost</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preload" href="style.css" as="style">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('gracie-theme');var lt=(t==='light');if(lt)document.documentElement.setAttribute('data-theme','light');var cur=lt?'bg-morning3':'bg-night3',alt=lt?'bg-night3':'bg-morning3';var p=document.createElement('link');p.rel='preload';p.as='image';p.type='image/webp';p.setAttribute('fetchpriority','high');p.href='img/'+cur+'.webp';document.head.appendChild(p);var q=document.createElement('link');q.rel='prefetch';q.as='image';q.href='img/'+alt+'.webp';document.head.appendChild(q);}catch(e){}</script>
</head>
<body class="nature2">
<button class="theme" id="themeBtn" type="button" aria-label="Ganti tema terang/gelap" onclick="toggleTheme()"></button>
$(if chap-id)
<div class="wrap"><div class="card"><p class="sub">Menghubungkan&hellip;</p></div></div>
$(endif)
<form name="redirect" action="$(link-login-only)" method="post">
  <input type="hidden" name="username" value="$(mac)">
  <input type="hidden" name="password" value="$(mac)">
  <input type="hidden" name="dst" value="$(link-orig)">
  <input type="hidden" name="popup" value="true">
</form>
<script>document.redirect.submit();</script>
<script src="theme.js"></script>
</body>
</html>
