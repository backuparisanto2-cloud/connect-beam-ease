<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lanjutkan &mdash; Griya Arca Kost</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preload" href="style.css" as="style">
<link rel="stylesheet" href="style.css">
<script>try{var wh=Math.floor((((Date.now()/3600000)+7)%24+24)%24);var o=null;try{o=sessionStorage.getItem('griya-arca-theme');}catch(e){}var lt=o?(o==='light'):(wh>=6&&wh<18);if(lt)document.documentElement.setAttribute('data-theme','light');var cur=lt?'bg-morning2':'bg-night2',alt=lt?'bg-night2':'bg-morning2';var sfx=(Math.min(screen.width,screen.height)<=640&&(window.devicePixelRatio||1)<=1.5)?'-sm':'';cur+=sfx;alt+=sfx;var p=document.createElement('link');p.rel='preload';p.as='image';p.type='image/webp';p.setAttribute('fetchpriority','high');p.href='img/'+cur+'.webp';document.head.appendChild(p);var c=navigator.connection||{};var mob=Math.min(screen.width,screen.height)<=640||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);if(!mob&&!c.saveData&&!/(^|-)2g$/.test(c.effectiveType||'')){var q=document.createElement('link');q.rel='prefetch';q.as='image';q.href='img/'+alt+'.webp';document.head.appendChild(q);}}catch(e){}</script>
</head>
<body class="nature">
<button class="theme" id="themeBtn" type="button" aria-label="Ganti tema terang/gelap" onclick="toggleTheme()"></button>
<div class="wrap"><div class="card">
  <p class="sub">Koneksi siap.</p>
  <a class="btn" href="$(link-redirect)" style="margin-top:14px">Buka Browser / Lanjutkan</a>
  <p class="sub" style="margin-top:12px;font-size:13.5px">Tekan tombol di atas untuk melanjutkan.</p>
</div></div>
<script src="theme.js"></script>
<script defer src="preload.js"></script>
</body>
</html>
