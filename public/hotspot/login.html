<script>

$(if chap-id)
function doLogin(){
  if(typeof hexMD5 !== 'function'){
    alert('Browser belum siap memproses login aman. Aktifkan JavaScript lalu muat ulang halaman ini.');
    return false;
  }
  document.login.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  return true;
}
